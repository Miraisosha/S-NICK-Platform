name: snick-platform

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: development
      APP_DEFAULT_LOCALE: ja_JP
      APP_DEFAULT_TIMEZONE: Asia/Tokyo
      APP_FULL_BASE_URL: http://localhost:${APP_PORT:-8080}
      DEBUG: "true"
      # Local dev only - not used for anything in production.
      SECURITY_SALT: "snick-platform-local-dev-salt-do-not-use-in-production"
      DATABASE_URL: mysql://${MYSQL_USER:-snick}:${MYSQL_PASSWORD:-snick_dev_password}@db:3306/${MYSQL_DATABASE:-snick_platform}?encoding=utf8mb4&timezone=Asia%2FTokyo
      DATABASE_TEST_URL: mysql://${MYSQL_USER:-snick}:${MYSQL_PASSWORD:-snick_dev_password}@db:3306/${MYSQL_DATABASE:-snick_platform}?encoding=utf8mb4&timezone=Asia%2FTokyo
      # Origin(s) allowed to call /api/v1/* (see src/Middleware/CorsMiddleware.php)
      # and the base URL used for verification/reset-password email links (see
      # src/Mailer/AuthMailer.php). Must match wherever `frontend/`'s dev server
      # actually runs - keep in sync with FRONTEND_PORT below if changed.
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      FRONTEND_BASE_URL: http://localhost:${FRONTEND_PORT:-5173}
      # Local dev only: emails are captured by DebugKit's Mail panel instead of
      # being sent. Real SMTP credentials (SCR-OPR-215) are environment-only in
      # production and never committed here.
      EMAIL_TRANSPORT_DEFAULT_URL: "debug://"
      TZ: Asia/Tokyo
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:${MYSQL_VERSION:-8.4}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-snick_platform}
      MYSQL_USER: ${MYSQL_USER:-snick}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-snick_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-snick_root_dev_password}
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Builds/serves `frontend/` (Vue.js FRONT), managed independently from the
  # `app` service (CakePHP API) - see docs/specifications/010_SystemArchitecture.md
  # "ディレクトリとAPI・FRONTの分離". Not required for local dev if Node.js is
  # already installed on the host: `cd frontend && npm install && npm run dev`
  # works the same way without Docker.
  node:
    image: node:${NODE_VERSION:-24}-bookworm-slim
    profiles: ["tools"]
    working_dir: /var/www/html
    environment:
      TZ: Asia/Tokyo
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/var/www/html
    command: ["sleep", "infinity"]

volumes:
  mysql-data:
