dashboard_sections:
  release_phase: 3
  phase_1_mode: published_events_by_start_time
  phase_3_sections:
    - live_now
    - entry_open
    - upcoming
    - past

labels:
  - live_now
  - today
  - entry_open
  - entry_closing_soon
  - entry_opening_soon
  - entry_closed
  - ended
  - new
  - live_stream_available

publication_states:
  release_phase: 3
  phase_1_default: listed
  values:
    - private
    - unlisted
    - listed
    - scheduled
    - publication_ended

live_states:
  - scheduled
  - starting_soon
  - live
  - ended
  - archived
  - cancelled

business_rules:
  - id: BR-PUB-001
    rule: 公開対象データだけを表示する
  - id: BR-PUB-002
    rule: 未ログイン申込はログイン後に元の申込対象へ復帰させる
  - id: BR-PUB-003
    rule: 状態ラベルを開催期間・申込期間・手動設定から算出する
  - id: BR-PUB-004
    rule: 共有用S-NICK公開URLを維持する
  - id: BR-PUB-005
    rule: 終了後は同じURLを結果・アーカイブへ切り替える

pending:
  - 画像の最大登録数・容量・許可形式
  - 状態ラベルの境界時刻とタイムゾーン
  - 確定前の進行・結果を公開する範囲
  - URL限定公開のアクセス制御
  - 公開終了後の保持期間
