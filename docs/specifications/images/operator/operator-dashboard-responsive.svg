<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">運営者画面 タブレット・スマートフォン版デザイン案</title>
  <desc id="desc">PC向け運営画面を、タブレットでは二列、スマートフォンでは一列カードへ変形した例。</desc>
  <style>
    text { font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif; fill:#2E261F; }
    .s { font-size:14px; }.b { font-size:17px; }.l { font-size:16px;font-weight:700; }.h { font-size:22px;font-weight:700; }.t { font-size:27px;font-weight:700; }.p { font-size:13px; fill:#8A8178; }.m { fill:#766B61; }.w { fill:#fff; }.br { fill:#572C00; }
  </style>
  <rect width="1400" height="920" fill="#F5EFE5"/>
  <text x="60" y="48" class="h">タブレット</text><text x="928" y="48" class="h">スマートフォン（緊急時）</text>

  <g transform="translate(60 70)">
    <rect width="800" height="800" rx="30" fill="#FFFCF5" stroke="#CFC3B5" stroke-width="3"/>
    <rect x="0" y="0" width="800" height="72" rx="30" fill="#FFFFFF"/><rect x="0" y="42" width="800" height="30" fill="#FFFFFF"/>
    <rect x="22" y="19" width="6" height="34" rx="3" fill="#FED258"/><text x="42" y="44" class="h br">Squash Platform</text>
    <rect x="570" y="12" width="154" height="48" rx="12" fill="#FFF3C4"/><text x="647" y="43" text-anchor="middle" class="l br">イベント選択⌄</text>
    <rect x="740" y="17" width="40" height="38" rx="11" fill="#572C00"/><text x="760" y="43" text-anchor="middle" class="l w">☰</text>
    <g transform="translate(28 96)">
      <text x="0" y="22" class="s m">8月8日（土）・東京スカッシュセンター</text>
      <text x="0" y="62" class="t">大会当日ダッシュボード</text>
      <rect x="650" y="27" width="92" height="36" rx="18" fill="#E8F7EE"/><text x="696" y="51" text-anchor="middle" class="l" fill="#237A45">開催中</text>
      <g transform="translate(0 92)">
        <rect width="230" height="98" rx="18" fill="#FFFFFF" stroke="#E7DED1"/><text x="18" y="31" class="b m">試合中</text><text x="18" y="72" font-size="30" font-weight="700">6</text>
        <rect x="248" width="230" height="98" rx="18" fill="#FFFFFF" stroke="#E7DED1"/><text x="266" y="31" class="b m">開始待ち</text><text x="266" y="72" font-size="30" font-weight="700">4</text>
        <rect x="496" width="246" height="98" rx="18" fill="#FFF4F5" stroke="#F2C5CC"/><text x="514" y="31" class="b" fill="#A3293D">対応が必要</text><text x="514" y="72" font-size="30" font-weight="700" fill="#A3293D">2</text><text x="716" y="69" text-anchor="end" class="l" fill="#A3293D">確認 →</text>
      </g>
      <g transform="translate(0 214)">
        <rect width="466" height="422" rx="20" fill="#FFFFFF" stroke="#E7DED1"/>
        <text x="20" y="46" class="h">現在・次の試合</text>
        <g transform="translate(16 70)"><rect width="434" height="92" rx="14" fill="#FFFDF8"/><text x="16" y="31" class="l">10:30　コートA</text><text x="16" y="62" class="b">佐藤 花子 vs 鈴木 美咲</text><text x="410" y="58" text-anchor="middle" font-size="28" class="br">›</text></g>
        <g transform="translate(16 174)"><rect width="434" height="92" rx="14" fill="#FFFDF8"/><text x="16" y="31" class="l">10:40　コートB</text><text x="16" y="62" class="b">田中 健 vs 山本 翔</text><text x="410" y="58" text-anchor="middle" font-size="28" class="br">›</text></g>
        <g transform="translate(16 278)"><rect width="434" height="92" rx="14" fill="#FFFDF8"/><text x="16" y="31" class="l">10:50　コートC</text><text x="16" y="62" class="b">高橋 葵 vs 伊藤 凛</text><text x="410" y="58" text-anchor="middle" font-size="28" class="br">›</text></g>
      </g>
      <g transform="translate(486 214)">
        <rect width="256" height="240" rx="20" fill="#FFFFFF" stroke="#E7DED1"/><text x="18" y="46" class="h">対応が必要</text>
        <rect x="14" y="66" width="228" height="96" rx="14" fill="#FFF4F5"/><text x="28" y="98" class="l" fill="#A3293D">コートB</text><text x="28" y="126" class="b">前試合が未終了</text>
        <rect x="112" y="174" width="130" height="50" rx="12" fill="#572C00"/><text x="177" y="206" text-anchor="middle" class="l w">確認する</text>
        <rect y="260" width="256" height="162" rx="20" fill="#FFFFFF" stroke="#E7DED1"/><text x="18" y="306" class="h">クイック操作</text>
        <rect x="14" y="326" width="228" height="62" rx="13" fill="#FED258"/><text x="128" y="365" text-anchor="middle" class="l br">試合状況を更新</text>
      </g>
      <text x="742" y="750" text-anchor="end" class="p">提供：株式会社未来創社</text>
    </g>
  </g>

  <g transform="translate(930 70)">
    <rect width="390" height="800" rx="34" fill="#FFFCF5" stroke="#CFC3B5" stroke-width="3"/>
    <rect width="390" height="68" rx="34" fill="#FFFFFF"/><rect y="38" width="390" height="30" fill="#FFFFFF"/>
    <rect x="18" y="17" width="6" height="32" rx="3" fill="#FED258"/><text x="38" y="42" class="h br">Squash Platform</text>
    <rect x="326" y="14" width="46" height="40" rx="11" fill="#572C00"/><text x="349" y="42" text-anchor="middle" class="l w">☰</text>
    <g transform="translate(18 88)">
      <text x="0" y="20" class="s m">第3回 関東選手権大会</text>
      <text x="0" y="57" class="t">当日運営</text><rect x="256" y="25" width="98" height="36" rx="18" fill="#E8F7EE"/><text x="305" y="49" text-anchor="middle" class="l" fill="#237A45">開催中</text>
      <rect y="82" width="354" height="88" rx="18" fill="#FFF4F5" stroke="#F2C5CC"/>
      <text x="18" y="113" class="l" fill="#A3293D">対応が必要　2件</text><text x="18" y="145" class="b">コートB 前試合が未終了</text><text x="332" y="145" text-anchor="end" class="l" fill="#A3293D">確認 →</text>
      <text x="0" y="211" class="h">現在・次の試合</text>
      <g transform="translate(0 228)"><rect width="354" height="112" rx="18" fill="#FFFFFF" stroke="#E7DED1"/><text x="16" y="32" class="l">10:30　コートA</text><text x="16" y="68" class="b">佐藤 花子 vs 鈴木 美咲</text><text x="330" y="70" text-anchor="middle" font-size="30" class="br">›</text></g>
      <g transform="translate(0 354)"><rect width="354" height="112" rx="18" fill="#FFFFFF" stroke="#E7DED1"/><text x="16" y="32" class="l">10:40　コートB</text><text x="16" y="68" class="b">田中 健 vs 山本 翔</text><text x="330" y="70" text-anchor="middle" font-size="30" class="br">›</text></g>
      <rect y="490" width="354" height="58" rx="14" fill="#FED258"/><text x="177" y="527" text-anchor="middle" class="l br">すべての試合を見る</text>
    </g>
    <text x="372" y="712" text-anchor="end" class="p">提供：株式会社未来創社</text>
    <rect x="0" y="724" width="390" height="76" rx="34" fill="#FFFFFF"/><rect y="724" width="390" height="40" fill="#FFFFFF"/>
    <g class="s"><text x="48" y="770" text-anchor="middle" class="br">ホーム</text><text x="144" y="770" text-anchor="middle">試合</text><text x="242" y="770" text-anchor="middle">警告</text><text x="340" y="770" text-anchor="middle">その他</text></g>
  </g>
</svg>
